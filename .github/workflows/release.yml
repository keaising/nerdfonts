name: Create and Publish Release

on:
  push:
    branches:
      - master
    paths:
      - origin/**
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out current project
        uses: actions/checkout@v7

      - name: Patch with Nerd Fonts
        run: |
          set -euo pipefail
          mkdir -p result
          docker run --rm \
            -v "$PWD/origin:/in" \
            -v "$PWD/result:/out" \
            nerdfonts/patcher:latest -c

      - name: Verify patched fonts
        run: |
          set -euo pipefail
          ls -l result
          count=$(find result -maxdepth 1 -type f | wc -l)
          echo "patched files: $count"
          test "$count" -gt 0
          unexpected=$(find result -maxdepth 1 -type f ! -name '*.ttf' ! -name '*.otf')
          if [ -n "$unexpected" ]; then
            echo "unexpected files in result, they would be uploaded too:"
            echo "$unexpected"
            exit 1
          fi

      - name: Create a new release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -z "$latest" ]; then
            tag=v0.0.1
          else
            version=${latest#v}
            major=${version%%.*}
            rest=${version#*.}
            minor=${rest%%.*}
            patch=${rest#*.}
            tag="v${major}.${minor}.$((patch + 1))"
          fi
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.create_release.outputs.tag_name }}" result/* --clobber
